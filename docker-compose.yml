services:
  app:
    build:
      context: .
      # Retargeting to another GUI app: override these, and rewrite the two
      # hook scripts at the bottom of the Dockerfile.
      # args:
      #   APP_NAME: KiCad
      #   APP_PACKAGES: kicad
      #   APP_EXEC: kicad
      #   APP_WM_CLASS: kicad
      #   APP_ICON: kicad
      #   APP_MCP_NAME: ""
      #   APP_MCP_COMMAND: ""
    container_name: freecad-claude
    ports:
      - "3000:3000"   # http
      - "3001:3001"   # https (self-signed)
    volumes:
      # ../files/ survives Dokploy's re-clone on redeploy; a path inside the
      # repo directory does not, and would take the documents, the Claude login
      # and the app's preferences with it.
      - ../files/config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - TITLE=FreeCAD + Claude
      # No window borders, and no auto-fullscreening one app over the other —
      # auto-fullscreen fights the tiling. Ctrl+Shift+d toggles borders live.
      - NO_DECOR=true
      - NO_FULL=true
      # Terminal pane width as a percentage of the usable desktop area.
      - SPLIT_PERCENT=38
      # Auth: set a key here, or leave it unset and run /login in the terminal
      # once — credentials persist on the volume.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Basic auth on the web UI. Convenience, not a security boundary.
      - CUSTOM_USER=${WEB_USER:-abc}
      - PASSWORD=${WEB_PASSWORD:-abc}
    shm_size: '2gb'
    # Qt/OpenGL trips Docker's default seccomp profile on some kernels.
    security_opt:
      - seccomp:unconfined
    # GPU note: upstream has stopped developing X11 acceleration and steers GPU
    # users to PIXELFLUX_WAYLAND=true, which swaps Openbox for Labwc — that
    # breaks wmctrl/xdotool, so tile-windows would need rewriting against the
    # Labwc IPC. On X11 the app renders through llvmpipe: fine for sketches and
    # modest parts, sluggish on heavy assemblies.
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
