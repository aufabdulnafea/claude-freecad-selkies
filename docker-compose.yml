services:
  freecad-claude:
    build: .
    container_name: freecad-claude
    ports:
      - "3000:3000"   # http
      - "3001:3001"   # https (self-signed)
    volumes:
      # Persists FreeCAD documents, the MCP addon settings, tmux/alacritty
      # config and — importantly — the Claude Code login, so you only auth once.
      - ./config:/config
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Europe/Berlin
      - TITLE=FreeCAD + Claude
      # No window borders, and don't auto-fullscreen one app over the other —
      # auto-fullscreen fights the side-by-side tiling.
      # Borders can be toggled back on in-session with Ctrl+Shift+d.
      - NO_DECOR=true
      - NO_FULL=true
      # Auth: either drop an API key here, or leave it unset and run `/login`
      # inside the terminal once — it persists in ./config.
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      # Basic auth on the web UI. Convenience only, not a security boundary.
      - CUSTOM_USER=${WEB_USER:-abc}
      - PASSWORD=${WEB_PASSWORD:-abc}
    shm_size: '2gb'
    # FreeCAD's Qt/OpenGL stack trips Docker's default seccomp profile on some
    # kernels. Drop this line if it starts fine without it.
    security_opt:
      - seccomp:unconfined
    # GPU note: upstream has stopped developing X11 acceleration and now steers
    # GPU users to `PIXELFLUX_WAYLAND=true`. That swaps Openbox for Labwc, which
    # breaks wmctrl/xdotool — so tile-windows would need rewriting against the
    # Labwc IPC. Staying on X11 means FreeCAD renders via llvmpipe: fine for
    # sketches and modest parts, sluggish on heavy assemblies.
    # devices:
    #   - /dev/dri:/dev/dri
    restart: unless-stopped
