services:
  freecad-claude:
    build: .
    container_name: freecad-selkies-claude
    ports:
      - "3000:3000"
    shm_size: '2gb'
    environment:
      - PUID=1000
      - PGID=1000
      - TZ=Etc/UTC
      - NO_FULL=true   # Prevents image from forcing the first window to full screen
      - NO_DECOR=true  # Prevents image from forcing title bars on windows
    restart: unless-stopped