# Catppuccin Mocha — the single source of truth for this session's palette.
# The panel, the desktop root and the app's stylesheet are all matched to it.

[window]
decorations = "None"
padding = { x = 10, y = 8 }
dynamic_padding = true

[font]
size = 11.0
# "monospace" rather than a literal family: /etc/fonts/local.conf points it at
# JetBrains Mono, and fontconfig falls back on its own if that font is missing.
[font.normal]
family = "monospace"
style = "Regular"
[font.bold]
family = "monospace"
style = "Bold"

[scrolling]
history = 50000

[colors.primary]
background = "#1e1e2e"
foreground = "#cdd6f4"
dim_foreground = "#a6adc8"
bright_foreground = "#cdd6f4"

[colors.cursor]
text = "#1e1e2e"
cursor = "#f5e0dc"

[colors.selection]
text = "#1e1e2e"
background = "#f5e0dc"

[colors.normal]
black = "#45475a"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#bac2de"

[colors.bright]
black = "#585b70"
red = "#f38ba8"
green = "#a6e3a1"
yellow = "#f9e2af"
blue = "#89b4fa"
magenta = "#f5c2e7"
cyan = "#94e2d5"
white = "#a6adc8"
